<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><defs>
  <linearGradient id="bga" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#12405A"/><stop offset="1" stop-color="#08182A"/>
  </linearGradient>
  <radialGradient id="haloa" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FFB547" stop-opacity="0.300"/>
    <stop offset="1" stop-color="#FFC861" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="golda" gradientUnits="userSpaceOnUse" x1="150" y1="90" x2="330" y2="410">
    <stop offset="0" stop-color="#FFD36E"/><stop offset="1" stop-color="#F2A23A"/>
  </linearGradient>
  <linearGradient id="conea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFE7AE" stop-opacity="0.850"/>
    <stop offset="0.55" stop-color="#FFC966" stop-opacity="0.380"/>
    <stop offset="1" stop-color="#FFA23A" stop-opacity="0.180"/>
  </linearGradient>
  <radialGradient id="poola" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FFF1C9" stop-opacity="0.900"/>
    <stop offset="1" stop-color="#FFF1C9" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="bulba" cx="0.5" cy="0.35" r="0.65">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFE6A6"/>
  </radialGradient>
  <filter id="blura" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
</defs><rect width="512" height="512" rx="112" fill="url(#bga)"/><g transform="translate(0.00,0.00) scale(1.00000)">
<g transform="translate(-20,6)">
