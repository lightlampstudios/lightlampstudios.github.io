    <ellipse cx="335" cy="250" rx="150" ry="150" fill="url(#haloa)"/>
    <path d="M296,197 L374,197 L428,364 L242,364 Z" fill="url(#conea)"/>
    <ellipse cx="335" cy="364" rx="100" ry="13" fill="url(#poola)"/>
